# Construit l'application (Python inclus) pour Windows, Mac Apple Silicon et Mac Intel, puis la publie
# dans une « Release » GitHub. Déclenchement : envoi d'une étiquette vX.Y (git tag v1.0 && git push --tags)
# ou bouton « Run workflow » dans l'onglet Actions du dépôt.
name: Construire l'application

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Nasdaq100-Windows.zip
          - os: macos-14          # Apple Silicon (M1, M2, M3…)
            artifact: Nasdaq100-Mac-AppleSilicon.zip
          - os: macos-15-intel    # Intel (macos-13 a été retiré par GitHub fin 2025)
            artifact: Nasdaq100-Mac-Intel.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Construction
        run: python -m PyInstaller packaging/nasdaq100.spec --noconfirm
      - name: Archive (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Nasdaq100.app "${{ matrix.artifact }}"
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Nasdaq100 -DestinationPath "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publication dans la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Nasdaq 100 $GITHUB_REF_NAME" \
              --notes "Application autonome (Python inclus). Voir le README pour l'ouverture sur Mac et Windows. Outil d'analyse — pas un conseil en investissement."
          gh release upload "$GITHUB_REF_NAME" out/*.zip --repo "$GITHUB_REPOSITORY" --clobber
